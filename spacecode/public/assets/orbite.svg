<svg viewBox="0 0 262 263" xmlns="http://www.w3.org/2000/svg">
    <circle
        cx={(100*(this.props.scale || 1))/2}
        cy={(100*(this.props.scale || 1))/2}
        r={100*(this.props.scale || 1)}
        fill="none"
        stroke="white"
        strokeOpacity="1"
        stroke-width="1"
    />
    <defs>
        <filter id="shadow">
            <feGaussianBlur stdDeviation="2" />
        </filter>
    </defs>
    <circle
        cx={(100*(this.props.scale || 1))/2}
        cy={(100*(this.props.scale || 1))/2}
        r={100*(this.props.scale || 1)}
        fill="none"
        stroke="white"
        strokeOpacity="0.5"
        stroke-width="1"
        filter="url(#shadow)"
    />
</svg>