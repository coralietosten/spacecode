stages:
  - deploy

deploy_production:
  stage: deploy
  only:
    - main
  before_script:
    - apt-get update -y --fix-missing
    - apt-get install -y --fix-missing openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa # > /dev/null 2>&1
    - echo "SERVER_IP=$SERVER_IP"
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - ssh $SERVER_USER@$SERVER_IP "cd $SERVER_PATH && ./launchServeur.bash"
